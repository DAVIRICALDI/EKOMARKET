<!DOCTYPE html>
<html lang="es">
    <head>
        <title>
            pagina integrada con css
        </title>
        <style type="text/css">

            * {
                padding: 0px;
                margin: 0px;
            }
            #header{
                margin: auto;
                width: 500px;
                font-family: Arial, Helvetica, sans-serif;
            }
            ul, ol{
                list-style: none;
            }
            .nav li a{
                background-color: #000;
                color: #fff;
                text-decoration: none;
                padding: 1px 5px;
                display:block;
            }
            .nav li a:hover{
                background-color: #434343;
            }
            .nav > li {
                float:left;
            }
            .nav li ul{
                display: none;
                position: absolute;
                min-width: 140px;
            }
            .nav li:hover > ul{
                display: block;
            }
            .nav li ul li{
                position: relative;
            }
            .nav li ul li ul{
                right: -140px;
                top:0px;
            }

        </style>
    </head>

<div id="header">
    <ul class="nav">
